[project]
name = "filesystem-permissions-tree"
version = "0.1.0"
description = "Scans directory trees for files and directories with unexpected permission bits, outputting violations for audits and CI pipelines."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
